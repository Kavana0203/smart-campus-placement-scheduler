<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 15px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: clamp(18px, 4vw, 28px);
        }

        /* Navigation */
        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .nav a {
            padding: 6px 12px;
            background: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: clamp(11px, 2vw, 14px);
        }
        .nav a:hover { background: #1976D2; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            font-size: clamp(10px, 1.5vw, 13px);
            color: #666;
            margin-bottom: 8px;
        }
        .stat-card .number {
            font-size: clamp(22px, 4vw, 32px);
            font-weight: bold;
        }

        /* Colors */
        .blue { color: #2196F3; }
        .green { color: #4CAF50; }
        .red { color: #f44336; }
        .purple { color: #9C27B0; }
        .orange { color: #FF9800; }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .chart-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: clamp(13px, 2vw, 16px);
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .chart-wrapper { height: 180px; }
        }
    </style>
</head>
<body>

<h1>🎓 Smart Campus Placement Dashboard</h1>

<!-- Navigation -->
<div class="nav">
    <a href="/student/register">Add Student</a>
    <a href="/admin/students">All Students</a>
    <a href="/admin/company/add">Add Company</a>
    <a href="/admin/companies">All Companies</a>
    <a href="/admin/drive/schedule">Schedule Drive</a>
    <a href="/admin/drives">All Drives</a>
</div>

<!-- Stats Cards -->
<div class="stats-grid">
    <div class="stat-card">
        <h3>Total Students</h3>
        <div class="number blue" th:text="${totalStudents}">0</div>
    </div>
    <div class="stat-card">
        <h3>Placed</h3>
        <div class="number green" th:text="${placedStudents}">0</div>
    </div>
    <div class="stat-card">
        <h3>Unplaced</h3>
        <div class="number red" th:text="${unplacedStudents}">0</div>
    </div>
    <div class="stat-card">
        <h3>Companies</h3>
        <div class="number purple" th:text="${totalCompanies}">0</div>
    </div>
    <div class="stat-card">
        <h3>Total Drives</h3>
        <div class="number orange" th:text="${totalDrives}">0</div>
    </div>
    <div class="stat-card">
        <h3>Upcoming</h3>
        <div class="number blue" th:text="${upcomingDrives}">0</div>
    </div>
    <div class="stat-card">
        <h3>Completed</h3>
        <div class="number green" th:text="${completedDrives}">0</div>
    </div>
</div>

<!-- Charts -->
<div class="charts-grid">
    <div class="chart-card">
        <h3>📊 Placement Status</h3>
        <div class="chart-wrapper">
            <canvas id="placementChart"></canvas>
        </div>
    </div>
    <div class="chart-card">
        <h3>🌿 Students by Branch</h3>
        <div class="chart-wrapper">
            <canvas id="branchChart"></canvas>
        </div>
    </div>
    <div class="chart-card">
        <h3>📅 Drive Status</h3>
        <div class="chart-wrapper">
            <canvas id="driveChart"></canvas>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const placedCount = [[${placedStudents}]];
    const unplacedCount = [[${unplacedStudents}]];
    const branchStats = [[${branchStats}]];
    const upcomingDrives = [[${upcomingDrives}]];
    const completedDrives = [[${completedDrives}]];

    const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }
    };

    // Placement Pie Chart
    new Chart(document.getElementById('placementChart'), {
        type: 'pie',
        data: {
            labels: ['Placed', 'Unplaced'],
            datasets: [{ data: [placedCount, unplacedCount],
                backgroundColor: ['#4CAF50', '#f44336'] }]
        },
        options: chartOptions
    });

    // Branch Bar Chart
    new Chart(document.getElementById('branchChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(branchStats),
            datasets: [{ label: 'Students', data: Object.values(branchStats),
                backgroundColor: '#2196F3' }]
        },
        options: { ...chartOptions,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
    });

    // Drive Doughnut Chart
    new Chart(document.getElementById('driveChart'), {
        type: 'doughnut',
        data: {
            labels: ['Upcoming', 'Completed'],
            datasets: [{ data: [upcomingDrives, completedDrives],
                backgroundColor: ['#2196F3', '#4CAF50'] }]
        },
        options: chartOptions
    });
</script>

</body>
</html>
